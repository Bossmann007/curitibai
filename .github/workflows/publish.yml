name: publish

# Publishes the version in package.json to npm (trusted publishing, OIDC) and then server.json to the MCP Registry
# (GitHub OIDC). Runs only when started by hand (Actions, "publish", "Run workflow" on main or on the release tag):
# never on a tag push or a push. Release steps: docs/development.md, "Release". The npm trusted publisher must name
# this file, publish.yml.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # No id-token here: npm ci, the tests and the build run in this job, so no dependency's install script or test can
  # ask for a token that publishes. Only the built dist/ goes on to the publish job.
  verify:
    if: github.repository == 'Bossmann007/curitibai' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip_npm: ${{ steps.preflight.outputs.skip_npm }}
      tarball_sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # no cache in a release build (https://docs.npmjs.com/trusted-publishers)

      - id: preflight
        name: Preflight (release tag, server.json version, package on npm)
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          [[ "$(node -p 'require("./server.json").version')" == "$version" ]] || fail "server.json version is not package.json's $version."
          # Publish only the tagged release commit (an annotated tag is peeled with ^{}).
          tag_sha="$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)"
          [[ -n "$tag_sha" ]] || tag_sha="$(git ls-remote origin "refs/tags/v$version" | cut -f1)"
          [[ -n "$tag_sha" ]] || fail "Tag v$version is not on GitHub: tag the release merge commit on main and push the tag, then run again."
          head_sha="$(git rev-parse HEAD)"
          [[ "$tag_sha" == "$head_sha" ]] || fail "This run is at $head_sha but v$version is $tag_sha: run the workflow on the tag v$version (\"Use workflow from\")."
          # npm trusted publishing is configured per package on npmjs.com, and npm's docs say the package must already
          # exist there (https://docs.npmjs.com/cli/v12/commands/npm-trust). npm does not check the configuration when
          # it is saved, so a missing one only shows as ENEEDAUTH at publish time; this is the check that can run now.
          if ! out="$(npm view "$name" name 2>&1)"; then
            if grep -q E404 <<<"$out"; then
              fail "$name is not on npm yet, so no trusted publisher can be configured for it. Publish the first version by hand (docs/development.md, Release), then run this workflow again."
            fi
            fail "npm view $name failed (not a 404; try again later): $out"
          fi
          if [[ "$(npm view "$name@$version" version 2>/dev/null || true)" == "$version" ]]; then
            echo "$name@$version is already on npm: npm publish is skipped, the MCP Registry step still runs."
            echo "skip_npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip_npm=false" >> "$GITHUB_OUTPUT"
          fi
          echo "release $name@$version at $head_sha (tag v$version)"

      - run: scripts/verify
        env:
          CURITIBAI_SKIP_AUDIT: "1"

      # The publish job checks that its tarball has this hash, so the artifact did not change between the jobs. The hash
      # does not show where it came from: the owner approves only a run on main or on a v* tag the owner pushed, at the release commit.
      - id: pack
        name: Tarball sha256 (job summary)
        run: |
          set -euo pipefail
          chmod -R u=rwX,go=rX dist # the hash depends on file modes; artifacts do not keep them
          file="$(npm pack --ignore-scripts --silent)"
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          rm -f "$file"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "$file sha256 $sha"
          printf '### Package to publish\n\n`%s` sha256 `%s` at `%s`\n' "$file" "$sha" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    if: github.repository == 'Bossmann007/curitibai' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    # GitHub environment "release": the owner approves each run (required reviewer), and only main and v* tags may
    # use it, so a pushed branch with an edited copy of this file cannot reach this job's OIDC token. The npm trusted
    # publisher names this environment too.
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # npm trusted publishing and mcp-publisher login github-oidc
    env:
      # Pinned as in https://modelcontextprotocol.io/registry/github-actions; upgrade on purpose, never releases/latest.
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Everything that can fail runs before the first irreversible step (npm publish). No npm ci in this job.
      - id: preflight
        name: Preflight (release tag, Node, npm, OIDC token, package contents and hash)
        env:
          APPROVED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag_sha="$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)"
          [[ -n "$tag_sha" ]] || tag_sha="$(git ls-remote origin "refs/tags/v$version" | cut -f1)"
          [[ -n "$tag_sha" && "$tag_sha" == "$(git rev-parse HEAD)" ]] || { echo "::error::This run is not at the commit tagged v$version."; exit 1; }
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && min < 14)) { console.log("::error::Node " + process.versions.node + " is too old for npm trusted publishing (22.14.0 or newer)"); process.exit(1); }'
          node -e '
            const [a, b] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && b < 20)) { console.log("::error::npm " + process.argv[1] + " is older than 11.20.0, the npm of Node 26.13.1 (.nvmrc); never install another npm in this job"); process.exit(1); }' "$(npm --version)"
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "::error::No GitHub OIDC token: the job needs permissions id-token: write."; exit 1; }
          node scripts/check-pack.mjs
          chmod -R u=rwX,go=rX dist # the hash depends on file modes; artifacts do not keep them
          # This tarball, not a new pack of the tree, is the one npm publish uploads.
          file="$(npm pack --ignore-scripts --silent)"
          sha="$(sha256sum "$file" | cut -d' ' -f1)"
          [[ "$sha" == "$APPROVED_SHA256" ]] || { echo "::error::Tarball sha256 $sha differs from the verify job's $APPROVED_SHA256."; exit 1; }
          echo "tarball=$file" >> "$GITHUB_OUTPUT"
          echo "tarball $file sha256 $sha (same as the verify job)"

      - name: Install cosign
        uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json with the MCP Registry
        run: ./mcp-publisher validate server.json

      - name: Check the MCP Registry login (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to npm (trusted publishing; provenance is added automatically)
        if: needs.verify.outputs.skip_npm != 'true'
        env:
          APPROVED_SHA256: ${{ needs.verify.outputs.tarball_sha256 }}
          TARBALL: ${{ steps.preflight.outputs.tarball }}
        run: |
          set -uo pipefail
          # Steps ran since the preflight: hash the file again right before uploading it.
          sha="$(sha256sum "$TARBALL" | cut -d' ' -f1)" || exit 1
          [[ "$sha" == "$APPROVED_SHA256" ]] || { echo "::error::$TARBALL sha256 $sha differs from the approved $APPROVED_SHA256."; exit 1; }
          if ! npm publish "./$TARBALL" --ignore-scripts 2>&1 | tee npm-publish.log; then
            if grep -qE 'ENEEDAUTH|E401|E403|E404|OIDC|trusted' npm-publish.log; then
              echo "::error::npm refused the publish. Check the trusted publisher of curitibai-mcp on npmjs.com: GitHub Actions, owner Bossmann007, repository curitibai, workflow file publish.yml (exact, case-sensitive), environment release, and 'npm publish' enabled under Allowed actions (new configurations allow only 'npm stage publish'). A new configuration also expires if its first publish does not happen within 2 days. See https://docs.npmjs.com/trusted-publishers"
            fi
            exit 1
          fi

      # The MCP Registry reads mcpName from npm, so wait until npm serves the new version (up to 5 minutes).
      - name: Wait for npm to serve the version
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          mcp="$(node -p 'require("./package.json").mcpName')"
          for i in $(seq 1 20); do
            [[ "$(npm view "$name@$version" mcpName 2>/dev/null || true)" == "$mcp" ]] && { echo "npm serves $name@$version (mcpName $mcp)"; exit 0; }
            sleep 15
          done
          echo "::error::npm does not serve $name@$version with mcpName $mcp after 5 minutes; run the workflow again later (npm publish will be skipped)."
          exit 1

      - name: Publish server.json to the MCP Registry
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
