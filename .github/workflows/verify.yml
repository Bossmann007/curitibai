name: verify

on:
  pull_request:
    # edited: adding a "Large PR because:" line to the body runs the PR-size step again.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # PR runs: a newer push cancels the running one. main: a running run is never cancelled, but a queued one is
  # replaced by a newer push, so not every push to main gets its own run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Edits of a closed PR run nothing. Any edit of an open PR runs the whole job: skipping title edits would post a
    # skipped (passing) verify over a failed one on the same commit.
    if: github.event.action != 'edited' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on pull_request HEAD is GitHub's merge commit and HEAD^1 the base, for the PR-size step.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Skip the separate npm audit step at the end of scripts/verify: it never changes the result, and new advisories
      # would only add noise to unrelated runs. Dependabot (.github/dependabot.yml) covers dependency updates.
      - run: scripts/verify
        env:
          CURITIBAI_SKIP_AUDIT: "1"
      # PR-size guard (CONTRIBUTING.md): over 400 changed lines fails unless the PR body explains it. Runs even when
      # verify failed (not when checkout did), so both results show. The body is passed in the environment, never inside
      # the script text.
      - if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'pull_request' }}
        run: scripts/pr-size.mjs HEAD^1 HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
