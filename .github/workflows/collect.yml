name: collect

# Nightly run of scripts/fetch-events.mjs (events and useful phones of turismo.curitiba.pr.gov.br), published to the
# orphan branch `data` (never main) by scripts/publish-data.sh. README "Events and useful phones" explains it.
on:
  schedule:
    # Five entries inside the site's robots.txt Visit-time (0200-0600), at odd minutes away from the busy top of the
    # hour. GitHub can delay a scheduled run during high load and drop queued ones (the first run, 2026-11-23, started
    # 8.5 h late), so later entries are retries. Gaps of 36 min or more, above the 35-minute job timeout; the last start
    # (05:13) plus the collector's 30-minute deadline ends before the window end it checks (05:50 UTC).
    # publish-data.sh sets CURITIBAI_COLLECT_ONCE_A_DAY=1: once both steps succeeded on the UTC date, later entries exit
    # 0 with no request and no push. A run GitHub starts outside the window makes no request and changes no file; it
    # exits 0 while both steps succeeded in the last 24 h, else 1 (a missed night stays a failed run).
    - cron: "37 2 * * *"
    - cron: "17 3 * * *"
    - cron: "59 3 * * *"
    - cron: "37 4 * * *"
    - cron: "13 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # Forks and other branches never crawl the site or push.
    if: github.repository == 'Bossmann007/curitibai' && github.ref == 'refs/heads/main'
    # Standard GitHub-hosted runner only (free for public repositories); never a larger runner.
    runs-on: ubuntu-latest
    # Above the collector's own 30-minute deadline, so the collector always stops first and the run still publishes.
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # No npm ci: the collector uses Node built-ins only, so no dependency code runs with contents: write.
      - run: scripts/publish-data.sh
        env:
          GH_TOKEN: ${{ github.token }}
