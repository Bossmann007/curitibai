name: Algo não funciona
description: Uma ferramenta dá erro, resposta errada ou para de responder
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Esta issue é pública. Não cole dados pessoais, tokens, nem o conteúdo de arquivos baixados (CSV do 156, exports da URBS)."
  - type: input
    id: tool
    attributes: { label: Ferramenta, placeholder: "Ex.: next_buses_near" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: O que aconteceu, description: "Os argumentos que você passou, o que esperava e o que voltou (o erro, por exemplo `source_unavailable`)." }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Versão e ambiente, placeholder: "Ex.: 0.13.2, Node 26.13.1, macOS, Claude Desktop" }
